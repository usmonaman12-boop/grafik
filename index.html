<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduScore</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f7f8fa;
    color:#111827;
}

button{
    border:none;
    cursor:pointer;
    font-weight:600;
}

.hidden{
    display:none!important;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f6f8;
}

.login-box{
    width:390px;
    background:white;
    padding:38px;
    border:1px solid #e5e7eb;
    border-radius:16px;
    box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.logo{
    font-size:27px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:28px;
}

input,select{
    width:100%;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    margin-bottom:14px;
    background:white;
}

input:focus,select:focus{
    border-color:#374151;
}

.primary{
    background:#1f2937;
    color:white;
    padding:12px 18px;
    border-radius:9px;
}

.primary:hover{
    background:#111827;
}

.blue{
    background:#334155;
    color:white;
    padding:10px 15px;
    border-radius:8px;
}

.green{
    background:#166534;
    color:white;
    padding:9px 14px;
    border-radius:8px;
}

.red{
    background:#991b1b;
    color:white;
    padding:9px 14px;
    border-radius:8px;
}

.gray{
    background:#e5e7eb;
    color:#111827;
    padding:9px 14px;
    border-radius:8px;
}

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#111827;
    color:white;
    padding:25px 18px;
}

.sidebar-logo{
    font-size:23px;
    font-weight:800;
    padding:0 10px 30px;
}

.nav button{
    width:100%;
    text-align:left;
    background:transparent;
    color:#d1d5db;
    padding:13px 12px;
    border-radius:8px;
    margin-bottom:5px;
}

.nav button:hover,
.nav button.active{
    background:#374151;
    color:white;
}

.logout{
    position:absolute;
    bottom:25px;
    left:18px;
    width:214px;
    padding:12px;
    border-radius:8px;
    background:#374151;
    color:white;
}

.main{
    margin-left:250px;
    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:27px;
}

.user-role{
    color:#6b7280;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:28px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:22px;
}

.card-title{
    color:#6b7280;
    font-size:14px;
    margin-bottom:10px;
}

.card-number{
    font-size:28px;
    font-weight:800;
}

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:22px;
    margin-bottom:22px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.panel-header h2{
    font-size:19px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:15px;
}

.group{
    border:1px solid #e5e7eb;
    padding:18px;
    border-radius:11px;
    cursor:pointer;
    transition:.2s;
}

.group:hover{
    border-color:#374151;
    transform:translateY(-2px);
}

.group-name{
    font-size:18px;
    font-weight:700;
    margin-bottom:7px;
}

.group-info{
    color:#6b7280;
    font-size:14px;
}

.student{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
}

.student-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.student-name{
    font-weight:700;
    font-size:17px;
}

.total-score{
    background:#f1f5f9;
    padding:8px 12px;
    border-radius:8px;
    font-weight:800;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.score-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #e5e7eb;
}

.score-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    color:#4b5563;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-box{
    background:white;
    width:450px;
    max-width:100%;
    padding:25px;
    border-radius:14px;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:13px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:6px;
    font-size:12px;
    font-weight:700;
}

.badge.green{
    background:#dcfce7;
    color:#166534;
}

.badge.red{
    background:#fee2e2;
    color:#991b1b;
}

.badge.yellow{
    background:#fef3c7;
    color:#92400e;
}

@media(max-width:900px){
    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){
    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .logout{
        position:static;
        margin-top:20px;
        width:100%;
    }

    .main{
        margin-left:0;
        padding:18px;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
    <div class="login-box">
        <div class="logo">EduScore</div>
        <div class="subtitle">O‘quvchilar ball tizimi</div>

        <input id="loginUsername" placeholder="Login">
        <input id="loginPassword" type="password" placeholder="Parol">

        <button class="primary" style="width:100%" onclick="login()">
            Kirish
        </button>

        <p id="loginError" style="color:#991b1b;margin-top:12px"></p>

        <div style="margin-top:22px;color:#6b7280;font-size:13px">
            Admin: <b>admin</b> / <b>1234</b>
        </div>
    </div>
</div>


<!-- APP -->
<div id="app" class="app hidden">

    <aside class="sidebar">
        <div class="sidebar-logo">EduScore</div>

        <div class="nav">
            <button id="navDashboard" class="active"
                onclick="showPage('dashboard')">
                Dashboard
            </button>

            <button id="navTeachers"
                onclick="showPage('teachers')">
                O‘qituvchilar
            </button>

            <button id="navGroups"
                onclick="showPage('groups')">
                Guruhlar
            </button>

            <button id="navStudents"
                onclick="showPage('students')">
                O‘quvchilar
            </button>

            <button id="navProfile"
                onclick="showPage('profile')">
                Profil
            </button>
        </div>

        <button class="logout" onclick="logout()">
            Chiqish
        </button>
    </aside>


    <main class="main">

        <!-- DASHBOARD -->
        <section id="dashboardPage">

            <div class="topbar">
                <div>
                    <h1>Dashboard</h1>
                    <div class="user-role" id="dashboardRole"></div>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <div class="card-title">O‘qituvchilar</div>
                    <div id="teacherCount" class="card-number">0</div>
                </div>

                <div class="card">
                    <div class="card-title">Guruhlar</div>
                    <div id="groupCount" class="card-number">0</div>
                </div>

                <div class="card">
                    <div class="card-title">O‘quvchilar</div>
                    <div id="studentCount" class="card-number">0</div>
                </div>

                <div class="card">
                    <div class="card-title">Jami ball</div>
                    <div id="scoreCount" class="card-number">0</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Guruhlar</h2>
                </div>

                <div id="dashboardGroups" class="grid"></div>
            </div>

        </section>


        <!-- TEACHERS -->
        <section id="teachersPage" class="hidden">

            <div class="topbar">
                <h1>O‘qituvchilar</h1>

                <button class="primary" onclick="openTeacherModal()">
                    + O‘qituvchi qo‘shish
                </button>
            </div>

            <div class="panel">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Ism</th>
                            <th>Login</th>
                            <th>Guruhlar</th>
                            <th>Amal</th>
                        </tr>
                    </thead>

                    <tbody id="teacherTable"></tbody>
                </table>
            </div>

        </section>


        <!-- GROUPS -->
        <section id="groupsPage" class="hidden">

            <div class="topbar">
                <h1>Guruhlar</h1>

                <button class="primary" onclick="openGroupModal()">
                    + Guruh qo‘shish
                </button>
            </div>

            <div id="groupsList" class="grid"></div>

            <div id="groupStudentsPanel" class="panel hidden"
                 style="margin-top:25px">

                <div class="panel-header">
                    <h2 id="selectedGroupTitle"></h2>

                    <button class="primary"
                        onclick="openStudentModal(selectedGroupId)">
                        + O‘quvchi qo‘shish
                    </button>
                </div>

                <div id="selectedGroupStudents"></div>
            </div>

        </section>


        <!-- STUDENTS -->
        <section id="studentsPage" class="hidden">

            <div class="topbar">
                <h1>O‘quvchilar</h1>

                <button class="primary" onclick="openStudentModal()">
                    + O‘quvchi qo‘shish
                </button>
            </div>

            <div class="panel">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Ism Familya</th>
                            <th>Guruh</th>
                            <th>Jami ball</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable"></tbody>
                </table>
            </div>

        </section>


        <!-- PROFILE -->
        <section id="profilePage" class="hidden">

            <div class="topbar">
                <h1>Profil</h1>
            </div>

            <div class="panel">
                <h2 id="profileName"></h2>
                <p id="profileRole" style="margin-top:8px;color:#6b7280"></p>
            </div>

        </section>

    </main>
</div>


<!-- MODAL -->
<div id="modal" class="modal hidden">

    <div class="modal-box">

        <h2 id="modalTitle"></h2>

        <div id="modalContent"></div>

        <div class="modal-actions">
            <button class="gray" onclick="closeModal()">Bekor qilish</button>
            <button class="primary" id="modalSave">Saqlash</button>
        </div>

    </div>
</div>


<script>

let database = JSON.parse(localStorage.getItem("eduscore_database")) || {
    teachers: [],
    groups: [],
    students: []
};

let currentUser = null;
let selectedGroupId = null;


function saveDatabase(){
    localStorage.setItem(
        "eduscore_database",
        JSON.stringify(database)
    );
}


function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value.trim();

    if(username === "admin" && password === "1234"){

        currentUser = {
            id:"admin",
            name:"Administrator",
            role:"admin"
        };

        enterApp();
        return;
    }

    const teacher = database.teachers.find(t =>
        t.username === username &&
        t.password === password
    );

    if(teacher){

        currentUser = {
            id:teacher.id,
            name:teacher.name,
            role:"teacher"
        };

        enterApp();
        return;
    }

    document.getElementById("loginError").textContent =
        "Login yoki parol noto‘g‘ri.";
}


function enterApp(){

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("app")
        .classList.remove("hidden");

    setupNavigation();
    renderAll();
    showPage("dashboard");
}


function logout(){

    currentUser = null;

    document.getElementById("app")
        .classList.add("hidden");

    document.getElementById("loginPage")
        .classList.remove("hidden");

    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
}


function setupNavigation(){

    const teachers = document.getElementById("navTeachers");
    const students = document.getElementById("navStudents");

    if(currentUser.role === "teacher"){

        teachers.classList.add("hidden");

    }else{

        teachers.classList.remove("hidden");
    }
}


function showPage(page){

    const pages = [
        "dashboard",
        "teachers",
        "groups",
        "students",
        "profile"
    ];

    pages.forEach(p => {

        document.getElementById(p + "Page")
            .classList.toggle("hidden", p !== page);

    });

    document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

    const nav = document.getElementById(
        "nav" + page.charAt(0).toUpperCase() + page.slice(1)
    );

    if(nav) nav.classList.add("active");

    renderAll();
}


function renderAll(){

    renderDashboard();
    renderTeachers();
    renderGroups();
    renderStudents();
    renderProfile();
}


function renderDashboard(){

    document.getElementById("dashboardRole").textContent =
        currentUser.role === "admin"
        ? "Administrator"
        : "O‘qituvchi: " + currentUser.name;

    document.getElementById("teacherCount").textContent =
        database.teachers.length;

    let visibleGroups = getVisibleGroups();

    document.getElementById("groupCount").textContent =
        visibleGroups.length;

    let students = getVisibleStudents();

    document.getElementById("studentCount").textContent =
        students.length;

    const total = students.reduce(
        (sum,s) => sum + (s.totalScore || 0), 0
    );

    document.getElementById("scoreCount").textContent = total;

    const box = document.getElementById("dashboardGroups");

    box.innerHTML = "";

    visibleGroups.forEach(group => {

        const studentsCount =
            database.students.filter(
                s => s.groupId === group.id
            ).length;

        box.innerHTML += `
            <div class="group"
                 onclick="openGroup(${group.id})">

                <div class="group-name">
                    ${escapeHTML(group.name)}
                </div>

                <div class="group-info">
                    ${studentsCount} ta o‘quvchi
                </div>
            </div>
        `;
    });
}


function getVisibleGroups(){

    if(currentUser.role === "admin")
        return database.groups;

    return database.groups.filter(
        g => g.teacherId === currentUser.id
    );
}


function getVisibleStudents(){

    const groups = getVisibleGroups()
        .map(g => g.id);

    return database.students.filter(
        s => groups.includes(s.groupId)
    );
}


function renderTeachers(){

    const table =
        document.getElementById("teacherTable");

    table.innerHTML = "";

    database.teachers.forEach(teacher => {

        const groups =
            database.groups.filter(
                g => g.teacherId === teacher.id
            );

        table.innerHTML += `
            <tr>
                <td>${escapeHTML(teacher.name)}</td>

                <td>${escapeHTML(teacher.username)}</td>

                <td>${groups.length}</td>

                <td>
                    <button class="red"
                        onclick="deleteTeacher(${teacher.id})">
                        O‘chirish
                    </button>
                </td>
            </tr>
        `;
    });
}


function renderGroups(){

    const list =
        document.getElementById("groupsList");

    list.innerHTML = "";

    getVisibleGroups().forEach(group => {

        const teacher =
            database.teachers.find(
                t => t.id === group.teacherId
            );

        const students =
            database.students.filter(
                s => s.groupId === group.id
            );

        list.innerHTML += `
            <div class="group"
                 onclick="openGroup(${group.id})">

                <div class="group-name">
                    ${escapeHTML(group.name)}
                </div>

                <div class="group-info">
                    O‘qituvchi:
                    ${teacher ? escapeHTML(teacher.name) : "—"}
                </div>

                <div class="group-info"
                     style="margin-top:5px">
                    ${students.length} ta o‘quvchi
                </div>
            </div>
        `;
    });
}


function renderStudents(){

    const table =
        document.getElementById("studentTable");

    table.innerHTML = "";

    getVisibleStudents().forEach(student => {

        const group =
            database.groups.find(
                g => g.id === student.groupId
            );

        table.innerHTML += `
            <tr>
                <td>
                    ${escapeHTML(student.name)}
                </td>

                <td>
                    ${group ? escapeHTML(group.name) : "—"}
                </td>

                <td>
                    <b>${student.totalScore || 0}</b>
                </td>
            </tr>
        `;
    });
}


function renderProfile(){

    document.getElementById("profileName").textContent =
        currentUser.name;

    document.getElementById("profileRole").textContent =
        currentUser.role === "admin"
        ? "Administrator"
        : "O‘qituvchi";
}


function openTeacherModal(){

    document.getElementById("modalTitle").textContent =
        "O‘qituvchi qo‘shish";

    document.getElementById("modalContent").innerHTML = `

        <input id="teacherName"
            placeholder="Ism Familya">

        <input id="teacherUsername"
            placeholder="Login">

        <input id="teacherPassword"
            placeholder="Parol">

    `;

    document.getElementById("modalSave")
        .onclick = addTeacher;

    openModal();
}


function addTeacher(){

    const name =
        document.getElementById("teacherName")
        .value.trim();

    const username =
        document.getElementById("teacherUsername")
        .value.trim();

    const password =
        document.getElementById("teacherPassword")
        .value.trim();

    if(!name || !username || !password){
        alert("Barcha maydonlarni to‘ldir.");
        return;
    }

    database.teachers.push({
        id:Date.now(),
        name,
        username,
        password
    });

    saveDatabase();
    closeModal();
    renderAll();
}


function deleteTeacher(id){

    if(!confirm("O‘qituvchini o‘chirasanmi?"))
        return;

    database.groups.forEach(g => {

        if(g.teacherId === id)
            g.teacherId = null;

    });

    database.teachers =
        database.teachers.filter(
            t => t.id !== id
        );

    saveDatabase();
    renderAll();
}


function openGroupModal(){

    const teacherOptions =
        database.teachers.map(t => `
            <option value="${t.id}">
                ${escapeHTML(t.name)}
            </option>
        `).join("");

    document.getElementById("modalTitle").textContent =
        "Guruh qo‘shish";

    document.getElementById("modalContent").innerHTML = `

        <input id="groupName"
            placeholder="Guruh nomi">

        <select id="groupTeacher">
            <option value="">O‘qituvchi tanlang</option>
            ${teacherOptions}
        </select>
    `;

    document.getElementById("modalSave")
        .onclick = addGroup;

    openModal();
}


function addGroup(){

    const name =
        document.getElementById("groupName")
        .value.trim();

    const teacherId =
        Number(document.getElementById("groupTeacher").value);

    if(!name || !teacherId){
        alert("Guruh nomi va o‘qituvchini tanla.");
        return;
    }

    database.groups.push({
        id:Date.now(),
        name,
        teacherId
    });

    saveDatabase();
    closeModal();
    renderAll();
}


function openStudentModal(groupId = null){

    let groups = getVisibleGroups();

    let options = groups.map(g => `
        <option value="${g.id}"
            ${groupId === g.id ? "selected" : ""}>
            ${escapeHTML(g.name)}
        </option>
    `).join("");

    document.getElementById("modalTitle").textContent =
        "O‘quvchi qo‘shish";

    document.getElementById("modalContent").innerHTML = `

        <input id="studentName"
            placeholder="O‘quvchi Ism Familyasi">

        <select id="studentGroup">
            <option value="">Guruh tanlang</option>
            ${options}
        </select>
    `;

    document.getElementById("modalSave")
        .onclick = addStudent;

    openModal();
}


function addStudent(){

    const name =
        document.getElementById("studentName")
        .value.trim();

    const groupId =
        Number(document.getElementById("studentGroup").value);

    if(!name || !groupId){
        alert("Ism va guruhni tanla.");
        return;
    }

    database.students.push({
        id:Date.now(),
        name,
        groupId,

        totalScore:0,

        attendance:[],
        homework:[],

        extraScore:0
    });

    saveDatabase();
    closeModal();

    renderAll();

    if(selectedGroupId)
        openGroup(selectedGroupId);
}


function openGroup(id){

    selectedGroupId = id;

    const group =
        database.groups.find(g => g.id === id);

    if(!group) return;

    document.getElementById("groupsPage")
        .classList.remove("hidden");

    document.getElementById("dashboardPage")
        .classList.add("hidden");

    document.getElementById("groupStudentsPanel")
        .classList.remove("hidden");

    document.getElementById("selectedGroupTitle")
        .textContent = group.name;

    renderGroupStudents();
}


function renderGroupStudents(){

    const box =
        document.getElementById("selectedGroupStudents");

    const students =
        database.students.filter(
            s => s.groupId === selectedGroupId
        );

    box.innerHTML = "";

    if(students.length === 0){

        box.innerHTML = `
            <p style="color:#6b7280">
                Bu guruhda hali o‘quvchi yo‘q.
            </p>
        `;

        return;
    }

    students.forEach(student => {

        box.innerHTML += createStudentCard(student);

    });
}


function createStudentCard(student){

    const today = new Date()
        .toISOString()
        .split("T")[0];

    const attendance =
        student.attendance.find(
            a => a.date === today
        );

    const homework =
        student.homework.find(
            h => h.date === today
        );

    return `

        <div class="student">

            <div class="student-top">

                <div class="student-name">
                    ${escapeHTML(student.name)}
                </div>

                <div class="total-score">
                    ${student.totalScore || 0} ball
                </div>

            </div>


            <div style="margin-bottom:8px">
                <b>Bugungi davomat:</b>
            </div>

            <div class="actions">

                <button class="green"
                    onclick="setAttendance(${student.id},true)">
                    ✓ Bor
                </button>

                <button class="red"
                    onclick="setAttendance(${student.id},false)">
                    ✕ Yo‘q
                </button>

            </div>

            <div style="margin-top:18px;margin-bottom:8px">
                <b>Uy vazifasi:</b>
            </div>

            <div class="actions">

                <button class="green"
                    onclick="setHomework(${student.id},'bor')">
                    ✓ Bor +5
                </button>

                <button
                    style="background:#92400e;color:white;padding:9px 14px;border-radius:8px"
                    onclick="setHomework(${student.id},'chala')">
                    Chala +3
                </button>

                <button class="red"
                    onclick="setHomework(${student.id},'yoq')">
                    ✕ Yo‘q +1
                </button>

            </div>


            <div style="margin-top:18px">

                <button class="blue"
                    onclick="addExtraScore(${student.id})">
                    + Qo‘shimcha ball
                </button>

            </div>


            <div class="score-box">

                <div class="score-row">
                    <span>Davomat ballari</span>
                    <b>${getAttendanceScore(student)}</b>
                </div>

                <div class="score-row">
                    <span>Uy vazifasi ballari</span>
                    <b>${getHomeworkScore(student)}</b>
                </div>

                <div class="score-row">
                    <span>Qo‘shimcha ball</span>
                    <b>${student.extraScore || 0}</b>
                </div>

                <div class="score-row"
                     style="margin-top:12px;color:#111827">
                    <strong>JAMI</strong>
                    <strong>${student.totalScore || 0}</strong>
                </div>

            </div>

            <div style="margin-top:15px">

                ${
                    attendance
                    ? `<span class="badge ${
                        attendance.present
                        ? "green"
                        : "red"
                    }">
                        ${
                            attendance.present
                            ? "Bugun bor"
                            : "Bugun yo‘q"
                        }
                    </span>`
                    : ""
                }

                ${
                    homework
                    ? `<span class="badge ${
                        homework.status === "bor"
                        ? "green"
                        : homework.status === "chala"
                        ? "yellow"
                        : "red"
                    }">
                        ${
                            homework.status === "bor"
                            ? "Vazifa bor"
                            : homework.status === "chala"
                            ? "Vazifa chala"
                            : "Vazifa qilinmadi"
                        }
                    </span>`
                    : ""
                }

            </div>

        </div>
    `;
}


function setAttendance(studentId,present){

    const student =
        database.students.find(
            s => s.id === studentId
        );

    if(!student) return;

    const today =
        new Date().toISOString().split("T")[0];

    student.attendance =
        student.attendance.filter(
            a => a.date !== today
        );

    student.attendance.push({
        date:today,
        present
    });

    calculateTotal(student);

    saveDatabase();

    renderAll();

    if(selectedGroupId)
        renderGroupStudents();
}


function setHomework(studentId,status){

    const student =
        database.students.find(
            s => s.id === studentId
        );

    if(!student) return;

    const today =
        new Date().toISOString().split("T")[0];

    student.homework =
        student.homework.filter(
            h => h.date !== today
        );

    student.homework.push({
        date:today,
        status
    });

    calculateTotal(student);

    saveDatabase();

    renderAll();

    if(selectedGroupId)
        renderGroupStudents();
}


function getAttendanceScore(student){

    return student.attendance.reduce(
        (sum,a) => sum + (a.present ? 3 : 0),
        0
    );
}


function getHomeworkScore(student){

    return student.homework.reduce(
        (sum,h) => {

            if(h.status === "bor")
                return sum + 5;

            if(h.status === "chala")
                return sum + 3;

            if(h.status === "yoq")
                return sum + 1;

            return sum;

        },0
    );
}


function calculateTotal(student){

    student.totalScore =
        getAttendanceScore(student) +
        getHomeworkScore(student) +
        Number(student.extraScore || 0);
}


function addExtraScore(studentId){

    const value =
        prompt("Qo‘shimcha ballni kiriting:");

    if(value === null) return;

    const score = Number(value);

    if(isNaN(score)){
        alert("Faqat son kiriting.");
        return;
    }

    const student =
        database.students.find(
            s => s.id === studentId
        );

    if(!student) return;

    student.extraScore =
        Number(student.extraScore || 0) + score;

    calculateTotal(student);

    saveDatabase();

    renderAll();

    if(selectedGroupId)
        renderGroupStudents();
}


function openModal(){

    document.getElementById("modal")
        .classList.remove("hidden");
}


function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");
}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
